[tool.poetry]
name = "gmail-scanner"
version = "0.1.0"
description = "Intelligent Job Application Tracker (personal email job checker)"
authors = ["You <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic-settings = "^2.6.1"
sqlmodel = "^0.0.22"
apscheduler = "^3.10.4"

# Gmail API (OAuth)
google-api-python-client = "^2.139.0"
google-auth = "^2.34.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.6"
pytest = "^8.3.3"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

